name: HealthTech Platform CI/CD Pipeline (Week 6 Final Capstone)

on:
  push:
    branches: [ main, week6-final-capstone ]
  pull_request:
    branches: [ main, week6-final-capstone ]

jobs:
  backend-lint-and-format:
    name: Backend Lint, Formatting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black ruff

      - name: Run Ruff Linter
        run: |
          ruff check backend/ --select E,F,W --ignore E501,E402

  backend-tests:
    name: Backend Unit, API, Model Smoke & Security Tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: test-ci-secret-key-at-least-32-chars-long
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/healthtech_test_db
      DJANGO_DEBUG: "False"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: healthtech_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-ml.txt

      - name: Run Model Smoke & Training Verification
        run: |
          cd backend
          python -m pytest mlcore/tests/test_ml_train.py mlcore/tests/test_ml_pipeline.py -q

      - name: Run RAG Benchmark & Retrieval Regressions
        run: |
          cd backend
          python -m pytest rag/tests_advanced.py -q

      - name: Run Agent Multi-Step & Safety Regressions
        run: |
          cd backend
          python -m pytest agents/tests_phase2.py agents/tests_phase3.py agents/tests_phase4.py -q

      - name: Run Week 6 Resilience, Health & Security Tests
        env:
          DJANGO_SECRET_KEY: test-ci-secret-key-at-least-32-chars-long
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/healthtech_test_db
        run: |
          cd backend
          python -m pytest tests/test_week6_resilience_security.py -q

  frontend-build:
    name: Frontend Lint, Type Check & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Build Next.js Production App
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

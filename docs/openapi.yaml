          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - full_name
      - password
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
      required:
      - email
      - full_name
      - id
    Wellness:
      type: object
      properties:
        activity_level:
          oneOf:
          - $ref: '#/components/schemas/ActivityLevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        diet_preference:
          oneOf:
          - $ref: '#/components/schemas/DietPreferenceEnum'
          - $ref: '#/components/schemas/BlankEnum'
        sleep_goal_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
          nullable: true
        reminder_channel:
          oneOf:
          - $ref: '#/components/schemas/ReminderChannelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        wellness_goals:
          type: string
          maxLength: 500
        allergy_notes:
          type: string
          maxLength: 1000
        condition_notes:
          type: string
          maxLength: 1000
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - updated_at
  securitySchemes:
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: admin_session
      description: Server-side session set by POST /api/admin/login as an HttpOnly
        cookie.
    memberJwtCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: Short-lived JWT set by POST /api/auth/user/login as an HttpOnly
        cookie.
